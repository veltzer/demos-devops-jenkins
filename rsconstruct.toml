# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.generator.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["exercises", "to_integrate"]
src_files = ["README.md"]

[processor.checker.zspell]
src_dirs = ["exercises"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["config", "exercises"]


[processor.checker.pyrefly]
src_dirs = ["config", "exercises"]

[processor.checker.ishellcheck]
src_dirs = ["exercises", "config", "to_integrate/unix_shell_scripts"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["exercises", "to_integrate/Calc"]

# ─── docker ──────────────────────────────────────────────────────────────────

[processor.checker.idockerfile]
src_dirs = ["exercises/intermediate/06_create_docker_image"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_dirs = ["to_integrate/groovyExamples"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
src_dirs = ["exercises/basic/13_java_and_maven", "to_integrate/Calc"]

# ─── java ────────────────────────────────────────────────────────────────────

[processor.checker.icheckstyle]
src_dirs = ["exercises/basic/13_java_and_maven/src/main/java/com/company", "to_integrate/Calc/src"]
