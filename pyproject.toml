# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-devops-jenkins"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "requests",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-requests",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false
